[package]
name = "tranquility"
version = "0.2.0"
edition = "2024"
readme = "../README.md"


[[bin]]
name = "tquil"
path = "src/main.rs"

[dependencies]
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
dirs = "6.0.0"
jsonschema = "0.38.1"
once_cell = "1.21.3"
quick-xml = { version = "0.38.4", features = ["serialize"] }
schemars = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
strum = { version = "0.27.2", features = ["derive"] }
reqwest = { version = "0.13.1", features = ["blocking", "json"] }
os_info = "3.13.0"
colored = "3.0.0"
bitflags = "2.10.0"
dialoguer = "0.12.0"
zip = "7.0.0"
heck = "0.5.0"
thiserror = "2.0.17"
scriba = { version = "0.5", features = ["full"] }

toml = "0.9.2"
tokio = { version = "1.28.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.17", features = ["fmt", "env-filter"] }

assert_cmd = "2"
assert_matches = "1.5.0"
predicates = "3"
assert_fs = "1.1.3"

directories = "6.0.0"

libc = "0.2"
