quick-xml = { version = "0.38.1", features = ["serialize"] }
reqwest = { version = "0.12.23", features = ["blocking", "json"] }
schemars = "1.0.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
serde_yaml = "0.9.34"
shellexpand = "3.1.1"
strum = { version = "0.27.2", features = ["derive"] }
