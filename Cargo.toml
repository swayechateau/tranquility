[package]
name = "tranquility"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.99"
bitflags = "2.9.2"
chrono = "0.4.41"
clap = { version = "4.5.45", features = ["derive"] }
colored = "3.0.0"
dialoguer = "0.11.0"
dirs = "6.0.0"
figlet-rs = "0.1.5"
heck = "0.5.0"
jsonschema = "0.32.1"
once_cell = "1.21.3"
